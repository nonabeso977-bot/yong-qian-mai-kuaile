<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>🌟 用钱买快乐🌟</title>

  <link rel="stylesheet" href="drawing.css">
</head>

<body>

  <main class="drawing-app">

    <!-- رأس الغرفة -->
    <header class="drawing-header">

      <button
        id="backButton"
        class="header-button"
        type="button"
        aria-label="رجوع">
        ‹
      </button>

      <h1 id="roomTitle">رسم</h1>

      <button
        id="clearPageButton"
        class="header-button"
        type="button"
        aria-label="مسح الصفحة">
        🗑️
      </button>

    </header>


    <!-- مساحة الرسم -->
    <section class="drawing-area">

      <div id="pageHint" class="page-hint"></div>

      <div class="canvas-wrap">
        <canvas id="drawingCanvas"></canvas>
      </div>

    </section>


    <!-- الصفحات -->
    <section class="pages-section">

      <button
        id="previousPageButton"
        class="page-control"
        type="button">
        ‹
      </button>

      <div id="pages" class="pages"></div>

      <button
        id="nextPageButton"
        class="page-control"
        type="button">
        ›
      </button>

      <button
        id="addPageButton"
        class="add-page"
        type="button"
        aria-label="إضافة ورقة">
        ＋
      </button>

    </section>


    <!-- أدوات الرسم -->
    <section class="drawing-tools">

      <button
        class="tool active"
        data-tool="pen"
        type="button">

        <span>✏️</span>
        <small>قلم</small>

      </button>


      <button
        class="tool"
        data-tool="eraser"
        type="button">

        <span>🧽</span>
        <small>ممحاة</small>

      </button>


      <button
        class="tool"
        data-tool="undo"
        type="button">

        <span>↩️</span>
        <small>تراجع</small>

      </button>


      <button
        class="tool"
        data-tool="redo"
        type="button">

        <span>↪️</span>
        <small>إعادة</small>

      </button>

    </section>


    <!-- حجم القلم -->
    <section class="brush-size">

      <label for="brushSize">
        حجم القلم
      </label>

      <input
        id="brushSize"
        type="range"
        min="1"
        max="40"
        value="5">

    </section>

  </main>


  <script src="drawing.js"></script>

</body>

</html>
