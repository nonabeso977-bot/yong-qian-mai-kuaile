<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>🌟 用钱买快乐 🌟</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="home-page">

    <header class="home-header">
      <h1>🌟 用钱买快乐 🌟</h1>
    </header>

    <section class="rooms">

      <button class="room-card" id="groupDrawingButton" type="button">
        <span>قروب رسم</span>
      </button>

      <button class="room-card" id="soloDrawingButton" type="button">
        <span>رسم فردي</span>
      </button>

      <button class="room-card" id="guessButton" type="button">
        <span>احزر</span>
      </button>

      <button class="room-card" id="classButton" type="button">
        <span>فصل</span>
      </button>

    </section>

    <nav class="bottom-navigation">

      <button id="settingsButton" type="button">
        <span>⚙️</span>
        <span>الإعدادات</span>
      </button>

      <button id="infoButton" type="button">
        <span>ⓘ</span>
        <span>معلومات</span>
      </button>

      <button id="profileButton" type="button">
        <span>👤</span>
        <span>الحساب</span>
      </button>

    </nav>

  </main>

  <script src="themes.js"></script>
  <script src="script.js"></script>

</body>

</html>
