<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>🌟用钱买快乐🌟</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <main class="app">

        <header class="app-header">

            <h1>🌟 用钱买快乐 🌟</h1>

        </header>


        <section class="main-menu">

            <button
                class="menu-button"
                id="groupDrawingButton"
                type="button"
            >
                🎨
                <span>قروب رسم</span>
            </button>


            <button
                class="menu-button"
                id="soloDrawingButton"
                type="button"
            >
                🖌️
                <span>رسم فردي</span>
            </button>


            <button
                class="menu-button"
                id="guessButton"
                type="button"
            >
                🔮
                <span>احزر</span>
            </button>

        </section>


        <nav class="bottom-navigation">

            <button
                id="profileButton"
                type="button"
            >
                👤
                <span>الحساب</span>
            </button>


            <button
                id="settingsButton"
                type="button"
            >
                ⚙️
                <span>الإعدادات</span>
            </button>

        </nav>

    </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>
<script src="themes.js"></script>
<script src="online.js"></script>
<script src="script.js"></script>
</body>

</html>
