<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🌟 用钱买快乐 🌟</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="home-page">

        <header class="home-header">
            <h1>🌟 用钱买快乐 🌟</h1>
            <p>مكان صغير للرسم واللعب</p>
        </header>


        <section class="rooms">

            <button class="room-card" id="groupDrawingButton" type="button">
                <span class="room-icon">🎨</span>

                <span class="room-info">
                    <strong>قروب رسم</strong>
                    <small>ارسم مع الآخرين</small>
                </span>
            </button>


            <button class="room-card" id="soloDrawingButton" type="button">
                <span class="room-icon">🖌️</span>

                <span class="room-info">
                    <strong>رسم فردي</strong>
                    <small>مساحتك الخاصة للرسم</small>
                </span>
            </button>


            <button class="room-card" id="guessButton" type="button">
                <span class="room-icon">🔮</span>

                <span class="room-info">
                    <strong>احزر</strong>
                    <small>ارسم وخليهم يخمنوا</small>
                </span>
            </button>


            <button class="room-card" id="classButton" type="button">
                <span class="room-icon">🏫</span>

                <span class="room-info">
                    <strong>فصل</strong>
                    <small>فصل خاص بالرسم واللعب</small>
                </span>
            </button>

        </section>


        <nav class="bottom-navigation">

            <button id="profileButton" type="button">
                <span>👤</span>
                <span>الحساب</span>
            </button>

            <button id="settingsButton" type="button">
                <span>⚙️</span>
                <span>الإعدادات</span>
            </button>

        </nav>

    </main>


    <script src="themes.js"></script>
    <script src="script.js"></script>

</body>

</html>
