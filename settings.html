<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>الإعدادات | 🌟用钱买快乐🌟</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <header class="page-header">
            <button class="back-button" id="backButton" type="button">
                ←
            </button>

            <h1>⚙️ الإعدادات</h1>
        </header>


        <section class="settings-list">

            <button class="settings-item" id="themeButton" type="button">
                <span class="settings-icon">🎨</span>

                <span class="settings-text">
                    <strong>الثيم</strong>
                    <small>اختاري شكل التطبيق وألوانه</small>
                </span>

                <span class="settings-arrow">›</span>
            </button>


            <button class="settings-item" id="soundButton" type="button">
                <span class="settings-icon">🔊</span>

                <span class="settings-text">
                    <strong>الأصوات</strong>
                    <small>أصوات الأزرار والتنبيهات</small>
                </span>

                <span class="settings-arrow">›</span>
            </button>


            <button class="settings-item" id="notificationsButton" type="button">
                <span class="settings-icon">🔔</span>

                <span class="settings-text">
                    <strong>الإشعارات</strong>
                    <small>إدارة إشعارات التطبيق</small>
                </span>

                <span class="settings-arrow">›</span>
            </button>


            <button class="settings-item" id="privacyButton" type="button">
                <span class="settings-icon">🔒</span>

                <span class="settings-text">
                    <strong>الخصوصية</strong>
                    <small>التحكم في بياناتك وظهورها</small>
                </span>

                <span class="settings-arrow">›</span>
            </button>


            <button class="settings-item" id="languageButton" type="button">
                <span class="settings-icon">🌐</span>

                <span class="settings-text">
                    <strong>اللغة</strong>
                    <small>لغة التطبيق</small>
                </span>

                <span class="settings-arrow">›</span>
            </button>


            <button class="settings-item" id="accountButton" type="button">
                <span class="settings-icon">👤</span>

                <span class="settings-text">
                    <strong>الحساب</strong>
                    <small>معلومات الحساب وتسجيل الدخول</small>
                </span>

                <span class="settings-arrow">›</span>
            </button>


            <button class="settings-item" id="aboutButton" type="button">
                <span class="settings-icon">ℹ️</span>

                <span class="settings-text">
                    <strong>عن التطبيق</strong>
                    <small>معلومات عن 🌟用钱买快乐🌟</small>
                </span>

                <span class="settings-arrow">›</span>
            </button>

        </section>

    </main>


    <script src="themes.js"></script>
    <script src="settings.js"></script>

</body>

</html>
